name: Release

# Push a v* tag to release. GoReleaser creates the GitHub Release itself.
on:
  push:
    tags: ['v*']

jobs:
  # The full CI suite, including the seccomp tests on amd64 and arm64.
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    name: GoReleaser
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for creating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs the tag history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The binary reports VERSION.txt; refuse to release a tag that
      # disagrees with it.
      - name: Check tag matches VERSION.txt
        run: |
          version=$(cat VERSION.txt)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION.txt ($version)"
            exit 1
          fi
          echo "AMICONTAINED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
