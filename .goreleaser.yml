version: 2

project_name: amicontained

builds:
  - id: amicontained
    main: .
    binary: amicontained
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0 # pure Go, so the binary is fully static
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X github.com/genuinetools/amicontained/version.VERSION={{ .Env.AMICONTAINED_VERSION }}
      - -X github.com/genuinetools/amicontained/version.GITCOMMIT={{ .ShortCommit }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: raesene
    name: amicontained
